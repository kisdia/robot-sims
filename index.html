<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Robotsims — Design your virtual robotics lab in isometric view. Manage your robot fleet, track maintenance, bookings, and equipment. By Autodiscovery.">
    <title>Robotsims — Virtual Robotics Lab | Autodiscovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <img src="assets/Autodiscovery_logo.png" alt="Autodiscovery" class="loading-logo" id="loading-logo">
            <h1 class="loading-title">Robotsims</h1>
            <p class="loading-subtitle">Virtual Robotics Lab Builder</p>
            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
            </div>
            <p class="loading-status" id="loading-status">Initializing engine...</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="app hidden">
        <!-- Top Bar -->
        <header id="top-bar" class="top-bar">
            <div class="top-bar-left">
                <img src="assets/Autodiscovery_logo.png" alt="Autodiscovery" class="app-logo" id="app-logo">
                <div class="app-title-group">
                    <span class="app-name">Robotsims</span>
                    <input type="text" id="lab-name-input" class="lab-name-input" value="My Robotics Lab" spellcheck="false">
                </div>
            </div>
            <div class="top-bar-center">
                <div class="zoom-controls">
                    <button class="icon-btn" id="btn-zoom-out" title="Zoom Out">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <span class="zoom-label" id="zoom-label">100%</span>
                    <button class="icon-btn" id="btn-zoom-in" title="Zoom In">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                    <button class="icon-btn" id="btn-zoom-fit" title="Fit to View">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="btn-secondary" id="btn-export" title="Export Lab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Export
                </button>
                <button class="btn-secondary" id="btn-import" title="Import Lab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Import
                </button>
                <button class="btn-primary" id="btn-save" title="Save Lab">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l4 4v12a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    Save
                </button>
            </div>
        </header>

        <!-- Left Toolbar -->
        <aside id="toolbar" class="toolbar">
            <div class="toolbar-group">
                <button class="tool-btn active" id="tool-select" data-tool="select" title="Select (V)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                    <span class="tool-label">Select</span>
                </button>
                <button class="tool-btn" id="tool-place" data-tool="place" title="Place Asset (P)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span class="tool-label">Place</span>
                </button>
                <button class="tool-btn" id="tool-room" data-tool="room" title="Draw Room (R)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M9 3v18"/></svg>
                    <span class="tool-label">Room</span>
                </button>
                <button class="tool-btn" id="tool-delete" data-tool="delete" title="Delete (X)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    <span class="tool-label">Delete</span>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button class="tool-btn" id="tool-pan" data-tool="pan" title="Pan (Space+Drag)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                    <span class="tool-label">Pan</span>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    <span class="tool-label">Undo</span>
                </button>
                <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
                    <span class="tool-label">Redo</span>
                </button>
            </div>
        </aside>

        <!-- Canvas Container -->
        <main id="canvas-container" class="canvas-container">
            <canvas id="iso-canvas"></canvas>
            <!-- Grid coordinates tooltip -->
            <div id="grid-tooltip" class="grid-tooltip hidden"></div>
        </main>

        <!-- Minimap -->
        <div id="minimap-container" class="minimap-container">
            <canvas id="minimap-canvas" width="180" height="120"></canvas>
            <div class="minimap-label">Minimap</div>
        </div>

        <!-- Right Panel — Asset Browser -->
        <aside id="asset-panel" class="asset-panel">
            <div class="panel-header">
                <h2 class="panel-title">Asset Library</h2>
                <button class="icon-btn panel-toggle" id="btn-toggle-assets" title="Toggle Panel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
            </div>
            <div class="panel-search">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="asset-search" class="search-input" placeholder="Search assets...">
            </div>
            <div class="panel-tabs" id="asset-tabs">
                <button class="panel-tab active" data-category="robots">🤖 Robots</button>
                <button class="panel-tab" data-category="rooms">🏠 Rooms</button>
                <button class="panel-tab" data-category="structure">🧱 Structure</button>
                <button class="panel-tab" data-category="furniture">🪑 Furniture</button>
                <button class="panel-tab" data-category="equipment">⚙️ Equipment</button>
                <button class="panel-tab" data-category="machines">🏭 Machines</button>
                <button class="panel-tab" data-category="decorations">🌿 Decor</button>
            </div>
            <div class="asset-grid" id="asset-grid">
                <!-- Populated by JS -->
            </div>
        </aside>

        <!-- Bottom Properties Panel -->
        <div id="properties-panel" class="properties-panel hidden">
            <div class="properties-header">
                <h3 class="properties-title" id="properties-title">Properties</h3>
                <button class="icon-btn" id="btn-close-properties" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="properties-body" id="properties-body">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Robot Detail Slide-Out Panel -->
        <div id="robot-detail-overlay" class="robot-detail-overlay hidden">
            <div id="robot-detail-panel" class="robot-detail-panel">
                <div class="robot-detail-header" id="robot-detail-header">
                    <button class="icon-btn robot-detail-close" id="btn-close-robot-detail" title="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                    <div class="robot-detail-hero" id="robot-detail-hero">
                        <!-- Robot image & title populated by JS -->
                    </div>
                </div>
                <nav class="robot-detail-tabs" id="robot-detail-tabs">
                    <button class="robot-tab active" data-tab="overview">Overview</button>
                    <button class="robot-tab" data-tab="profile">⭐ Profile</button>
                    <button class="robot-tab" data-tab="equipment">Equipment</button>
                    <button class="robot-tab" data-tab="specs">Specifications</button>
                    <button class="robot-tab" data-tab="maintenance">Maintenance</button>
                    <button class="robot-tab" data-tab="booking">Booking</button>
                    <button class="robot-tab" data-tab="warranty">Warranty</button>
                </nav>
                <div class="robot-detail-content" id="robot-detail-content">
                    <!-- Tab content populated by JS -->
                </div>
            </div>
        </div>

        <!-- Room Type Selector (shown when drawing rooms) -->
        <div id="room-type-selector" class="room-type-selector hidden">
            <h3 class="room-type-title">Room Type</h3>
            <div class="room-type-options" id="room-type-options">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Status Bar -->
        <footer id="status-bar" class="status-bar">
            <span class="status-coords" id="status-coords">X: 0  Y: 0</span>
            <span class="status-separator">|</span>
            <span class="status-objects" id="status-objects">0 objects</span>
            <span class="status-separator">|</span>
            <span class="status-mode" id="status-mode">Select Mode</span>
            <span class="status-right">
                <span class="status-autosave" id="status-autosave">Auto-saved</span>
            </span>
        </footer>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="file-import" accept=".json" class="hidden">

    <script type="module" src="js/main.js"></script>
</body>
</html>
